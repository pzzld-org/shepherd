[package]
default-run = "shepherd"
description = "The canonical shepherd command-line interface over the per-project registry, run artifacts, and sprint pipeline."
name = "shepherd-cli"

authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
# rlib only. `cdylib` was template residue: it builds a dynamic library on every
# compile for a target nothing consumes. The napi/wasm paths that would need it
# are explicitly deferred out of this arc — add it back with the spike, not before.
crate-type = ["rlib"]

[[bin]]
name = "shepherd"
path = "bin/cli.rs"

[dependencies]
# engine — the harness-agnostic core this binary adapts
shepherd = { workspace = true }
# cli
clap = { features = ["cargo", "derive", "env"], workspace = true }
# config
config = { workspace = true }
# parsing
nom = { workspace = true }
# errors
anyhow = { workspace = true }
thiserror = { workspace = true }
# serialize
serde = { features = ["derive"], workspace = true }
serde_json = { workspace = true }
# database
rusqlite = { workspace = true }
# templating
minijinja = { workspace = true }
# hashing
sha2 = { workspace = true }
# tracing
tracing = { features = ["attributes", "log"], workspace = true }
tracing-subscriber = { features = ["env-filter", "fmt"], workspace = true }

[features]
default = [
  "bundled",
  "std",
]

full = [
  "default",
]

# ********* [FF] Targets *********
native = ["full"]

# NOTE: neither wasm target may enable `bundled`. `bundled` pulls libsqlite3-sys,
# which compiles SQLite from C and needs a sysroot. Dropping it lets rusqlite's
# default `ffi-sqlite-wasm-rs` take over on wasm32-unknown-unknown. Verified: a
# 2.07MB module with fts5, json_valid and the unicode61 tokenizer compiled in.
# Apple clang has no wasm backend; use LLVM's.
wasi = [
  "std",
  "wasi-vfs",
]

wasm = [
  "std",
]

# ********* [FF] Standard Library *********
alloc = [
  "serde/alloc",
  "serde_json/alloc",
  "shepherd/alloc",
]

std = [
  "alloc",
  "anyhow/std",
  "serde/std",
  "serde_json/std",
  "shepherd/std",
  "thiserror/std",
  "tracing/std",
]

# ********* [FF] Deps *********
bundled = [
  "rusqlite/bundled",
]

wasi-vfs = [
  "rusqlite/wasm32-wasi-vfs",
]
