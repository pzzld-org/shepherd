# write-boundary — governs whether a role may perform a filesystem write at all,
# and if so, where. Interpreted identically by the Rust engine and the generated
# harness carriers, this predicate is the native contract for typed Write,
# Edit, and apply_patch calls.
#
# RoleFact.write_eligible together with the native `write` capability is the
# role fact for general structured writes. A role may instead carry a narrow
# report-write capability; that exception is evaluated only for a typed report
# path and never turns an absent or fabricated dispatch scope into a general grant.
#
# Bash is an opaque effect carrier. Missing or malformed command input is
# unresolved, and arbitrary shell effects under a bounded or non-writable native
# dispatch fail closed wholesale. The guard does not parse shell text, infer
# redirect targets, or authorize command substrings. The separate closed
# git-custody classifier remains responsible only for its known VCS action domain.

[predicate]
id = "write-boundary"
version = 1
description = "A typed filesystem write is denied unless native role facts grant structured write or narrow report-write, and the target path falls inside the current dispatch scope."

[[rule]]
id = "role-write-eligibility"
description = "fs.write is denied unless native role facts grant structured write (write_eligible plus write) or the narrow report-write capability."
subject = "role.write_eligible"
action = "fs.write"
effect = "deny_if_false"

[[rule]]
id = "path-in-declared-scope"
description = "Even a write_eligible = true role's write is denied when the target path falls outside the write_scope this specific dispatch's brief declares (a general write grant is not a blanket grant — the brief's file scope narrows it per dispatch)."
subject = "dispatch.write_scope"
action = "fs.write"
effect = "deny_if_path_outside_scope"

[[example]]
name = "coder-writes-inside-declared-file-scope"
kind = "allow"
role = "coder"
action = "fs.write"
path = "content/roles/coder.md"
context = { write_eligible = true, path_in_dispatch_write_scope = true }
result = "allow"

[[example]]
name = "coder-writes-outside-declared-file-scope"
kind = "deny"
role = "coder"
action = "fs.write"
path = "hooks/scripts/coder_git_guard.sh"
context = { write_eligible = true, path_in_dispatch_write_scope = false }
result = "deny"
halt_code = "SCOPE OVERFLOW"

[[example]]
name = "discovery-writes-its-one-declared-output-path"
kind = "allow"
role = "discovery"
action = "fs.write"
path = "{run_dir}/reports/discovery-d1-harness.md"
context = { write_eligible = false, path_in_dispatch_write_scope = true }
result = "allow"
note = "write_eligible = false plus a narrow report-write scope is one fact, not a contradiction — see RECONCILIATION.md §write_eligible."

[[example]]
name = "discovery-writes-outside-its-declared-output-path"
kind = "deny"
role = "discovery"
action = "fs.write"
path = "skills/adaptation/SKILL.md"
context = { write_eligible = false, path_in_dispatch_write_scope = false }
result = "deny"
halt_code = "DISCOVERY-WRITE-PATH"

[[example]]
name = "critic-attempts-any-write"
kind = "deny"
role = "critic"
action = "fs.write"
path = "{run_dir}/reports/critic-note.md"
context = { write_eligible = false, path_in_dispatch_write_scope = false }
result = "deny"
note = "critic carries no write capability at all — not even a narrow report-path exception; content/roles/critic.md write_scope = none."
