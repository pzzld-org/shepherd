[package]
build = "build.rs"
description = "The shepherd registry: the SQLite schema, migration runner, and query surface that every harness reads directly."
name = "shepherd-registry"

authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
bench = false
crate-type = ["rlib"]

[[test]]
name = "default"
required-features = ["bundled"]

[package.metadata.docs.rs]
all-features = false
features = ["full"]
rustc-args = ["--cfg", "docsrs"]
version = "v{{version}}"

[package.metadata.release]
no-dev-version = true
tag-name = "v{{version}}"

[dependencies]
# engine
shepherd-core = { workspace = true }
# database
rusqlite = { workspace = true }
# errors
thiserror = { workspace = true }
# serialization
serde = { optional = true, workspace = true }
serde_json = { optional = true, workspace = true }
# tracing
tracing = { optional = true, workspace = true }

[features]
default = [
  "bundled",
  "std",
]

full = [
  "default",
  "json",
  "tracing",
]

# ********* [FF] Flags *********
json = [
  "alloc",
  "dep:serde",
  "dep:serde_json",
  "shepherd-core/json",
]

# ********* [FF] Targets *********
native = ["full"]

nightly = [
  "shepherd-core/nightly",
]

# NOTE: neither wasm target may enable `bundled`. `bundled` pulls
# libsqlite3-sys, which compiles SQLite from C and needs a sysroot. Dropping it
# lets rusqlite's `ffi-sqlite-wasm-rs` backend take over on
# wasm32-unknown-unknown. Verified against 0.40: a 2.07MB module with fts5,
# json_valid and the unicode61 tokenizer compiled in. Apple's system clang has
# no wasm backend; use LLVM's.
wasi = [
  "json",
  "std",
  "wasi-vfs",
]

wasm = [
  "json",
  "std",
]

# ********* [FF] Standard Library *********
alloc = [
  "serde?/alloc",
  "serde_json?/alloc",
  "shepherd-core/alloc",
]

std = [
  "alloc",
  "serde?/std",
  "serde_json?/std",
  "shepherd-core/std",
  "thiserror/std",
  "tracing?/std",
]

# ********* [FF] Deps *********
bundled = [
  "rusqlite/bundled",
]

tracing = [
  "dep:tracing",
  "shepherd-core/tracing",
]

wasi-vfs = [
  "rusqlite/wasm32-wasi-vfs",
]
