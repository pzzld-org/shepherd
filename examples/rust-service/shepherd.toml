# Layout-v5 configuration for a multi-crate Rust service.
# Copy to .shepherd/shepherd.toml.

[project]
name = "rust-service"
description = "Multi-crate Rust service with native, Wasm, and adapter gates."
language = "rust"
harnesses = ["claude", "codex", "pi"]

[branching]
patch_branch_pattern = "v{X}.{Y}.{Z}"
sprint_branch_pattern = "v{X}.{Y}.{Z}-dev.{N}"
patch_slug_pattern = "v{X}{Y}{Z}"
sprint_slug_pattern = "v{X}{Y}{Z}-dev{N}"
sprints_per_patch = 10
main_branch = "main"
release_tag_pattern = "v{X}.{Y}.{Z}"
allow_direct_main_commit = false

[paths]
docs = ".shepherd/docs"
ctx = ".shepherd/ctx"
runs = ".shepherd/runs"

[gates]
check = "cargo check --workspace --all-features --locked"
lint = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"
format = "cargo fmt --all -- --check"

[gates.extra]
test = "cargo test --workspace --all-features --locked"
wasm = "cargo build --locked -p shepherd-component --target wasm32-wasip2 --release"
adapters = "bash scripts/test-adapters-component.sh"

[skills]
mandatory = ["shepherd"]

[skills.by_domain]
rust = ["thinking"]
wasm = ["thinking"]

[skills.detection]
rust = ["**/*.rs"]
wasm = ["**/*.wit", "crates/component/**"]

[release]
driver = "github-workflow"
release_notes_path = "CHANGELOG.md"
workflow_file = ".github/workflows/release.yml"
devlast_guard = "block"

[spawn]
max_parallel = 3
lead_effort = "high"

[mcp]
github = true

[cli]
gh = true
