# Example shepherd configuration — a multi-crate Rust service.
#
# A fully-fleshed-out binding (compare with ../minimal/shepherd.toml). It models
# a common real-world topology: a workspace with an HTTP `service-node` binary and
# a background `service-worker` binary, each gated under its own feature profile.
# Drop-in install: cp this file to <repo-root>/.claude/shepherd.toml
#
# See ../../docs/configuration.md for the schema.

[project]
name        = "rust-service"
language    = "rust"
description = "Multi-crate Rust service — HTTP node + background worker over a shared core."

[branching]
patch_branch_pattern  = "v{X}.{Y}.{Z}"
sprint_branch_pattern = "v{X}.{Y}.{Z}-dev.{N}"
# Filesystem-slug forms (v5.1.1+) — dots collapsed for filename safety.
patch_slug_pattern    = "v{X}{Y}{Z}"
sprint_slug_pattern   = "v{X}{Y}{Z}-dev{N}"
sprints_per_patch     = 10
main_branch           = "main"
release_tag_pattern   = "v{X}.{Y}.{Z}"
allow_direct_main_commit = false

[gates]
# Three canonical cargo gates, run in sequence between coder waves and at sprint
# close. Empty string = skip the gate.
check  = "cargo check --workspace --features full"
lint   = "cargo clippy --workspace --features full -- -D warnings"
format = "cargo fmt --all"

# Supplementary gates that exercise per-binary build profiles. These DO matter —
# `--workspace --features full` does NOT activate the node/worker [[bin]]
# required-features, so a workspace-green build can still ship a broken binary.
extra = [
    { name = "node-serve",   cmd = "cargo check -p service-node --features serve,native" },
    { name = "worker-serve", cmd = "cargo check -p service-worker --features serve" },
]

target_clean_threshold_gb = 20

[paths]
# This example uses the legacy .artifacts/ namespace (a project initialized before
# v5.0.0). These paths must match the active shctx namespace (`shctx doctor` reports
# a conflict if they diverge). New projects should use .shepherd/ (the v5.0.0+ default).
plans   = ".artifacts/plans"
reports = ".artifacts/reports"
docs    = ".artifacts/docs"
ctx     = ".artifacts/ctx"

[skills]
mandatory = ["code-style"]

[skills.by_domain]
rust       = ["rust"]
wasm       = ["webassembly"]
supabase   = ["supabase:supabase"]
claude_api = ["claude-api"]

[skills.detection]
rust       = ["**/*.rs"]
wasm       = ["cmp/**", "**/*.wit"]
supabase   = ["**/supabase/**", "**/migrations/**.sql"]
claude_api = ["clients/rsclaude/**", "**/anthropic/**"]

[mcp]
github   = true
sentry   = true
supabase = true
grafana  = false

[cli]
fly    = true
gh     = true
docker = true
just   = false
make   = false

[ledger]
phase_0_full_ledger      = true
classify_into            = ["blocking-this-sprint", "labeled-non-issue", "tracking-future", "drift-risk"]
non_issue_labels         = ["wontfix", "tracking-future", "design-question", "rfc"]
carry_forward_file       = "{paths.plans}/v{X}.{Y}.{Z}-carry-forwards.md"
chronic_threshold_patches = 2

[release]
driver             = "github-workflow"
release_notes_path = "{paths.docs}/v{X}.{Y}.{Z}-release-notes.md"
workflow_file      = ".github/workflows/release.yml"

[memory]
project_memory    = "~/.claude/projects/<your-project>/memory"
project_doctrines = ".claude/doctrines"

[hooks]
on_every_dispatch = ["code-style"]
on_conductor_only = []
on_engineer_only  = ["workflow"]
on_planter_only   = []

[compaction]
# Snapshot drive-state before every compaction event (on by default).
# The PreCompact hook writes state.json cursor + focus digest into
# <namespace>/snapshots/ so the orchestrator can rehydrate after compaction.
# Never blocks compaction. Prunes old snapshots to snapshot_retention count.
precompact_snapshot = "on"   # on (default) | off
snapshot_retention  = 5      # keep N most-recent snapshots

[focus]
# Re-inject the latest snapshot as additionalContext post-compaction so the
# orchestrator resumes its drive without manual re-orientation.
# Drain-once; runaway-bounded. Controls both SessionStart(compact) and
# UserPromptSubmit fallback paths.
rehydrate        = "on"   # on (default) | off
loop_max_default = 8      # default max_iterations for FOCUS-LOOP (Pattern 6)
