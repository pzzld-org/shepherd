# Minimal layout-v5 configuration. Copy to .shepherd/shepherd.toml.

[project]
name = "my-project"
description = "A project coordinated by the native Shepherd runtime."
language = "rust"
harnesses = ["claude", "codex", "pi"]

[branching]
patch_branch_pattern = "v{X}.{Y}.{Z}"
sprint_branch_pattern = "v{X}.{Y}.{Z}-dev.{N}"
patch_slug_pattern = "v{X}{Y}{Z}"
sprint_slug_pattern = "v{X}{Y}{Z}-dev{N}"
sprints_per_patch = 10
main_branch = "main"
release_tag_pattern = "v{X}.{Y}.{Z}"
allow_direct_main_commit = false

[paths]
docs = ".shepherd/docs"
ctx = ".shepherd/ctx"
runs = ".shepherd/runs"

[gates]
check = "cargo check --workspace --locked"
lint = "cargo clippy --workspace --all-targets --locked -- -D warnings"
format = "cargo fmt --all -- --check"

[skills]
mandatory = ["shepherd"]

[skills.by_domain]
rust = ["thinking"]

[spawn]
max_parallel = 3
lead_effort = "high"
