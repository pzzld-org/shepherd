# Axiom-specific shepherd configuration.
#
# This file binds shepherd v4.0.0 to the Axiom project.
# Drop-in install: cp this file to <repo-root>/.claude/shepherd.toml
#
# See ../../docs/configuration.md for the schema.

[project]
name        = "axiom"
language    = "rust"
description = "BTC prediction + Polymarket trading. Closed-loop attribution → reweight → execution."

[branching]
patch_branch_pattern  = "v{X}.{Y}.{Z}"
sprint_branch_pattern = "v{X}.{Y}.{Z}-dev.{N}"
sprints_per_patch     = 10
main_branch           = "main"
release_tag_pattern   = "v{X}.{Y}.{Z}"
allow_direct_main_commit = false

[gates]
# Three canonical Axiom cargo gates, run in sequence between coder waves
# and at sprint close. Empty string = skip the gate.
check  = "cargo check --workspace --features full"
lint   = "cargo clippy --workspace --features full -- -D warnings"
format = "cargo fmt --all"

# Supplementary gates that exercise Fly-build profiles. These DO matter —
# workspace-features-full does NOT activate node/worker [[bin]] required-features
# (per feedback_third_cargo_gate_for_serve_required.md).
extra = [
    { name = "node-serve",   cmd = "cargo check -p axiom-node --features serve,native" },
    { name = "worker-serve", cmd = "cargo check -p axiom-worker --features serve" },
]

target_clean_threshold_gb = 20

[paths]
# Axiom was initialized before v5.0.0 and uses the legacy .artifacts/ namespace.
# These paths must match the shctx namespace (`shctx doctor` reports a conflict
# if they diverge). New projects should use .shepherd/ (the v5.0.0+ default).
plans   = ".artifacts/plans"
reports = ".artifacts/reports"
docs    = ".artifacts/docs"
ctx     = ".artifacts/ctx"

[skills]
mandatory = ["code-style"]

[skills.by_domain]
rust       = ["rust"]
wasm       = ["webassembly"]
finance    = ["finance"]
supabase   = ["supabase:supabase"]
polymarket = ["polymarket"]
claude_api = ["claude-api"]

[skills.detection]
rust       = ["**/*.rs"]
wasm       = ["cmp/**", "**/*.wit"]
supabase   = ["**/supabase/**", "**/migrations/**.sql"]
polymarket = ["**/polymarket/**", "**/clob/**", "**/pm/**"]
claude_api = ["clients/rsclaude/**", "**/anthropic/**"]
finance    = ["crates/circuits/**", "crates/math/**", "crates/engine/**", "cmp/**"]

[mcp]
github   = true
sentry   = true
supabase = true
grafana  = false

[cli]
fly    = true
gh     = true
docker = true
just   = false
make   = false

[ledger]
phase_0_full_ledger      = true
classify_into            = ["blocking-this-sprint", "labeled-non-issue", "tracking-future", "drift-risk"]
non_issue_labels         = ["wontfix", "tracking-future", "design-question", "rfc"]
carry_forward_file       = "{paths.plans}/v{X}.{Y}.{Z}-carry-forwards.md"
chronic_threshold_patches = 2

[release]
driver             = "github-workflow"
release_notes_path = "{paths.docs}/v{X}.{Y}.{Z}-release-notes.md"
workflow_file      = ".github/workflows/release.yml"

[memory]
project_memory    = "~/.claude/projects/-Users-jo3-src-fl03-axiom/memory"
project_doctrines = ".claude/doctrines"

[hooks]
on_every_dispatch = ["code-style"]
on_conductor_only = []
on_engineer_only  = ["workflow"]
on_planter_only   = []
