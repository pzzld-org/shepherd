[workspace]
default-members = [
  "crates/cli","crates/sdk"
]
exclude = [
]
members = [
  "crates"
]
resolver = "3"

[workspace.package]
authors = [
  "FL03 <joe@pzzld.org>",
  "Scattered-Systems LLC <support@scsys.io>",
]
categories = ["command-line-utilities", "development-tools"]
description = "Sprint orchestration and governance for AI coding agents — the canonical engine and CLI behind the shepherd plugin."
edition = "2024"
homepage = "https://github.com/FL03/shepherd/wiki"
keywords = ["agent", "orchestration", "sprint", "cli", "plugin"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/FL03/shepherd.git"
rust-version = "1.96.0"
version = "6.4.5"

[workspace.dependencies]
# bin
shepherd-cli = { default-features = false, path = "crates/cli", version = "6.4.5" }
# sdk
shepherd = { default-features = false, path = "crates/sdk", version = "6.4.5" }
shepherd-core = { default-features = false, path = "crates/core", version = "6.4.5" }

# cli
clap = { features = ["cargo", "derive", "env"], version = "4" }
# databases
rusqlite = { version = "0.40" }
# config
# TOML only. Defaults pull json/yaml/ini/ron/json5/convert-case/async, and `async`
# drags in async-trait against the no-async-runtime decision. `ini` alone pulls
# rust-ini -> ordered-multimap -> dlv-list -> const-random -> getrandom.
# shepherd.toml is the only config format shepherd has ever read.
config = { default-features = false, features = ["toml"], version = "0.15" }
schemars = { default-features = false, features = ["derive"], version = "1" }
# parsing — structured text only (slugs, brief headers, seed blocks)
nom = { default-features = false, features = ["std"], version = "8" }
# templating
minijinja = { version = "2" }
# hashing
sha2 = { default-features = false, version = "0.11" }
# serialization
serde = { default-features = false, features = ["derive"], version = "1" }
serde_json = { default-features = false, version = "1" }
# macros & utils
strum = { default-features = false, features = ["derive"], version = "0.28" }
# error handling
anyhow = { default-features = false, version = "1" }
thiserror = { default-features = false, version = "2" }
# identifiers — project.json carries a UUIDv7 project id
uuid = { default-features = false, features = ["serde", "v7"], version = "1" }
# time — run.json updated_at must round-trip int, float and ISO8601
chrono = { default-features = false, features = ["clock", "serde", "std"], version = "0.4" }
# tracing
tracing = { default-features = false, features = ["attributes", "log"], version = "0.1" }
tracing-subscriber = { features = ["env-filter", "fmt"], version = "0.3" }

# ********* Profiles *********
[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 1
overflow-checks = true
rpath = false
strip = false

[profile.release]
codegen-units = 16
debug = false
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 2
overflow-checks = false
panic = "unwind"
rpath = false
strip = true

[profile.docker]
codegen-units = 4
inherits = "release"
lto = "thin"
