name: release

# Patch-release pipeline. Triggered when a patch branch (v*.*.*) merges into the
# default branch (main): the merge commit subject is "vX.Y.Z", "vX.Y.Z:
# <summary>", or "release: vX.Y.Z" (gh appends " (#N)" on squash — tolerated).
# The extracted version is cross-checked against .claude-plugin/plugin.json;
# non-release pushes to main are skipped cleanly.
#
# Flow: v*.*.* → main → build and verify immutable assets → tag and publish vCURRENT.
# Post-publication branch/version/PR housekeeping runs in gitflow.yml after this
# workflow completes successfully and verifies the published release custody.
#
# The merge into main IS the release event — there is NO separate "release PR
# vCURRENT → main" step (that PR is the one that just merged). Branch protection
# on main MUST require PR + linear history + no force-push for a reliable trigger.

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.detect.outputs.proceed }}
      current: ${{ steps.detect.outputs.current }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Detect exact release version
        id: detect
        shell: bash
        env:
          DEFAULT_BRANCH_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "$DEFAULT_BRANCH_REF" ]]; then
            printf 'proceed=false\n' >> "$GITHUB_OUTPUT"
            printf 'Skipping release from non-default ref: %s\n' "$GITHUB_REF"
            exit 0
          fi
          subject=$(git log -1 --format=%s HEAD)
          if [[ "$subject" =~ ^(release:[[:space:]]+)?v([0-9]+\.[0-9]+\.[0-9]+)([[:space:]:]|$) ]]; then
            current="${BASH_REMATCH[2]}"
            plugin=$(jq -r '.version' .claude-plugin/plugin.json)
            if [[ "$current" == "$plugin" ]]; then
              python3 scripts/version-bump.py check --root . --version "$current"
              {
                printf 'proceed=true\n'
                printf 'current=%s\n' "$current"
                printf 'tag=v%s\n' "$current"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          printf 'proceed=false\n' >> "$GITHUB_OUTPUT"

  build-native-assets:
    name: Native ${{ matrix.target }}
    needs: release-metadata
    if: needs.release-metadata.outputs.proceed == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Setup Zig for GNU libc 2.17 builds
        if: contains(matrix.target, 'unknown-linux-gnu')
        uses: mlugg/setup-zig@v2 # v2.2.1
        with:
          version: 0.14.0
      - name: Install locked cargo-zigbuild
        if: contains(matrix.target, 'unknown-linux-gnu')
        shell: bash
        run: cargo install cargo-zigbuild --version 0.20.1 --locked
      - name: Build locked canonical CLI
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == *-unknown-linux-gnu ]]; then
            cargo zigbuild --locked --release --package shepherd-cli --target "${TARGET}.2.17"
          else
            cargo build --locked --release --package shepherd-cli
          fi
      - name: Execute and verify the native CLI version
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.current }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary='target/release/shepherd'
          if [[ "$TARGET" == *-unknown-linux-gnu ]]; then
            binary="target/${TARGET}/release/shepherd"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            binary="${binary}.exe"
          fi
          actual=$("$binary" --version)
          expected="shepherd-cli ${VERSION}"
          [[ "$actual" == "$expected" ]] || {
            printf 'native CLI version mismatch: expected %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          }
      - name: Assert GNU libc compatibility floor
        if: contains(matrix.target, 'unknown-linux-gnu')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/shepherd"
          readelf --version-info "$binary" | python3 scripts/assert-glibc-floor.py 2.17
      - name: Package Unix archive and SHA-256 sidecars
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.current }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          staging="${RUNNER_TEMP}/shepherd-native-${TARGET}"
          mkdir -p "$staging"
          if [[ "$TARGET" == *-unknown-linux-gnu ]]; then
            cp "target/${TARGET}/release/shepherd" "$staging/shepherd"
          else
            cp target/release/shepherd "$staging/shepherd"
          fi
          scripts/stage-distribution-legal.sh "$staging" --scope native --target "$TARGET"
          chmod 0755 "$staging/shepherd"
          TZ=UTC find "$staging" -type f -exec touch -t 198001010000 {} +
          legal_entries=()
          while IFS= read -r entry; do
            legal_entries+=("$entry")
          done < <(
              cd "$staging"
              find THIRD_PARTY_LICENSES -type f -name '*.txt' -print | LC_ALL=C sort
            )
          ((${#legal_entries[@]} > 0))
          versioned="shepherd-${VERSION}-${TARGET}.tar.gz"
          stable="shepherd-${TARGET}.tar.gz"
          scripts/create-release-tar.sh \
            "$staging" "dist/${versioned}" \
            LICENSE THIRD_PARTY_NOTICES.md "${legal_entries[@]}" shepherd
          cp "dist/${versioned}" "dist/${stable}"
          (
            cd dist
            shasum -a 256 "${versioned}" > "${versioned}.sha256"
            shasum -a 256 "${stable}" > "${stable}.sha256"
          )
      - name: Package Windows archive and SHA-256 sidecars
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.release-metadata.outputs.current }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $staging = Join-Path $env:RUNNER_TEMP "shepherd-native-$env:TARGET"
          New-Item -ItemType Directory -Force $staging | Out-Null
          $stagedBinary = Join-Path $staging 'shepherd.exe'
          Copy-Item -LiteralPath target/release/shepherd.exe -Destination $stagedBinary
          bash scripts/stage-distribution-legal.sh "$staging" --scope native --target "$env:TARGET"
          Get-ChildItem -LiteralPath $staging -Recurse -File | ForEach-Object { $_.LastWriteTimeUtc = [DateTime]'1980-01-01T00:00:00Z' }
          $versioned = "shepherd-$env:VERSION-$env:TARGET.zip"
          $stable = "shepherd-$env:TARGET.zip"
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function New-DeterministicZip([string]$Destination) {
            if (Test-Path -LiteralPath $Destination) { Remove-Item -LiteralPath $Destination -Force }
            $archive = [System.IO.Compression.ZipFile]::Open(
              $Destination,
              [System.IO.Compression.ZipArchiveMode]::Create
            )
            try {
              $files = @(Get-ChildItem -LiteralPath $staging -Recurse -File | Sort-Object FullName)
              foreach ($file in $files) {
                $relative = $file.FullName.Substring($staging.Length).TrimStart([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar).Replace('\', '/')
                $entry = $archive.CreateEntry($relative, [System.IO.Compression.CompressionLevel]::Optimal)
                $entry.LastWriteTime = [DateTimeOffset]'1980-01-01T00:00:00Z'
                $source = [System.IO.File]::OpenRead($file.FullName)
                try {
                  $destinationStream = $entry.Open()
                  try { $source.CopyTo($destinationStream) } finally { $destinationStream.Dispose() }
                } finally { $source.Dispose() }
              }
            } finally { $archive.Dispose() }
          }
          New-DeterministicZip "dist/$versioned"
          $reproducibilityProbe = Join-Path $env:RUNNER_TEMP "shepherd-$env:TARGET-repro.zip"
          New-DeterministicZip $reproducibilityProbe
          if ((Get-FileHash -LiteralPath "dist/$versioned" -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $reproducibilityProbe -Algorithm SHA256).Hash) {
            throw 'Windows release ZIP is not reproducible from identical staged inputs'
          }
          Remove-Item -LiteralPath $reproducibilityProbe -Force
          Copy-Item -LiteralPath "dist/$versioned" -Destination "dist/$stable"
          foreach ($asset in @($versioned, $stable)) {
            $hash = (Get-FileHash -LiteralPath "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset" | Set-Content -NoNewline -LiteralPath "dist/$asset.sha256"
          }
      - name: Verify asset sidecars
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            for check in *.sha256; do
              shasum -a 256 --check "$check"
            done
          )
      - name: Verify asset sidecars
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath dist -Filter '*.sha256' | ForEach-Object {
            if ((Get-Content -LiteralPath $_.FullName) -notmatch '^[0-9A-Fa-f]{64}  [^/\\]+$') {
              throw "invalid checksum sidecar: $($_.Name)"
            }
          }
      - name: Exercise the Windows installer against the packaged asset
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.release-metadata.outputs.current }}
        run: scripts/tests/test-release-installer-windows.ps1 -Version $env:VERSION -ArchiveDirectory dist
      - name: Exercise the Windows installer with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        env:
          VERSION: ${{ needs.release-metadata.outputs.current }}
        run: scripts/tests/test-release-installer-windows.ps1 -Version $env:VERSION -ArchiveDirectory dist
      - name: Upload native release assets
        uses: actions/upload-artifact@v7 # v7.0.1
        with:
          name: release-native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  build-component-assets:
    name: Component and harness adapters
    needs: release-metadata
    if: needs.release-metadata.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Setup Rust with the Component Model target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          target: wasm32-wasip2
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Build and validate the Component Model artifact
        run: |
          set -euo pipefail
          cargo build --locked --release --package shepherd-component --target wasm32-wasip2
          bash scripts/test-component-node.sh
          node --test packages/component-runtime/test/*.test.mjs
          node packages/harness-claude/test.mjs
          node packages/harness-codex/test.mjs
          node packages/harness-pi/test.mjs
          node packages/scripts/check-package-boundary.mjs
          bash scripts/test-packed-plugin.sh
      - name: Stage Wasm component and npm adapter tarballs
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.current }}
        run: |
          set -euo pipefail
          wasm='target/wasm32-wasip2/release/shepherd_component.wasm'
          test -s "$wasm"
          mkdir -p dist stage/packages
          component_stage="${RUNNER_TEMP}/shepherd-component-wasm32-wasip2"
          mkdir -p "$component_stage"
          cp "$wasm" "$component_stage/shepherd-component.wasm"
          scripts/stage-distribution-legal.sh "$component_stage"
          TZ=UTC find "$component_stage" -type f -exec touch -t 198001010000 {} +
          component_legal_entries=()
          while IFS= read -r entry; do
            component_legal_entries+=("$entry")
          done < <(
              cd "$component_stage"
              find THIRD_PARTY_LICENSES -type f -name '*.txt' -print | LC_ALL=C sort
            )
          ((${#component_legal_entries[@]} > 0))
          for asset in \
            "shepherd-component-${VERSION}-wasm32-wasip2.tar.gz" \
            'shepherd-component-wasm32-wasip2.tar.gz'; do
            scripts/create-release-tar.sh \
              "$component_stage" "dist/${asset}" \
              LICENSE THIRD_PARTY_NOTICES.md "${component_legal_entries[@]}" shepherd-component.wasm
          done
          for package in component-runtime harness-claude harness-codex harness-pi; do
            cp -R "packages/${package}" "stage/packages/${package}"
          done
          SHEPHERD_COMPONENT_NODE_ROOT="$PWD" SHEPHERD_COMPONENT_WASM="$wasm" \
            scripts/stage-component-runtime.sh stage
          scripts/stage-distribution-legal.sh stage
          ln -s "$PWD/node_modules" stage/packages/component-runtime/node_modules
          for package in component-runtime harness-claude harness-codex harness-pi; do
            (
              cd "stage/packages/${package}"
              npm pack --json --ignore-scripts --pack-destination "$PWD/../../../dist" >/dev/null
            )
          done
          (
            cd dist
            for asset in *; do
              sha256sum "$asset" > "${asset}.sha256"
            done
          )
      - name: Verify component and npm release asset sidecars
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            for check in *.sha256; do
              sha256sum --check --status "$check"
            done
          )
      - name: Upload Component Model and adapter assets
        uses: actions/upload-artifact@v7 # v7.0.1
        with:
          name: release-component-and-adapters
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish verified release
    needs: [release-metadata, build-native-assets, build-component-assets]
    if: needs.release-metadata.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - name: Detect release commit
        id: detect
        run: |
          set -euo pipefail
          SUBJECT=$(git log -1 --format=%s HEAD)
          if [[ "$SUBJECT" =~ ^(release:[[:space:]]+)?v([0-9]+\.[0-9]+\.[0-9]+)([[:space:]:]|$) ]]; then
            SUBJECT_VER="${BASH_REMATCH[2]}"
            PLUGIN_VER=$(jq -r '.version' .claude-plugin/plugin.json)
            if [ "$SUBJECT_VER" = "$PLUGIN_VER" ]; then
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              printf 'Release commit detected: %s (v%s) on %s\n' "$SUBJECT" "$SUBJECT_VER" "${{ github.ref_name }}"
            else
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              printf '::warning::Subject version (v%s) does not match plugin.json (v%s); skipping.\n' "$SUBJECT_VER" "$PLUGIN_VER"
            fi
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            printf 'Skipping: head subject does not match release pattern.\nSubject: %s\n' "$SUBJECT"
          fi

      - name: Configure git identity
        if: steps.detect.outputs.proceed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Resolve current release version
        if: steps.detect.outputs.proceed == 'true'
        id: ver
        run: |
          set -euo pipefail
          CURRENT=$(jq -r '.version' .claude-plugin/plugin.json)
          {
            echo "current=$CURRENT"
            echo "tag=v${CURRENT}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v${CURRENT}."

      - name: Extract release notes from CHANGELOG.md
        if: steps.detect.outputs.proceed == 'true'
        id: notes
        env:
          CURRENT: ${{ steps.ver.outputs.current }}
        run: |
          set -euo pipefail
          NOTES="${RUNNER_TEMP}/release-notes-v${CURRENT}.md"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="${CURRENT}" '
              BEGIN { gsub(/\./, "\\.", ver); pat = "^## v" ver "( |$)" }
              $0 ~ pat                   { capture = 1; print; next }
              capture && /^## v[0-9]/    { exit }
              capture                    { print }
            ' CHANGELOG.md > "$NOTES"
          fi
          if [ -s "$NOTES" ]; then
            echo "use_notes_file=true" >> "$GITHUB_OUTPUT"
            echo "::group::Extracted release notes for v${CURRENT}"
            head -20 "$NOTES"
            echo "::endgroup::"
          else
            echo "use_notes_file=false" >> "$GITHUB_OUTPUT"
            # Hard-fail instead of silently auto-generating notes: v6.3.4/v6.3.5
            # shipped undocumented precisely because this fell back without a
            # signal (the #207 fix went unrecorded). This step only runs on a
            # genuine release commit (detect.proceed == 'true' → subject `vX.Y.Z`
            # == plugin.json), so it can never block the auto-cut next-patch
            # bump commit — only a real release that forgot its entry. Fixing it
            # is a one-line CHANGELOG.md add + re-push. hooks/tests/
            # test_changelog_current.sh catches the same gap pre-release/local.
            echo "::error title=Missing changelog entry::No '## v${CURRENT}' section in CHANGELOG.md. Every release commit MUST carry its own changelog entry before merge — add '## v${CURRENT} — YYYY-MM-DD' to CHANGELOG.md and re-push. (Closes the gap that shipped v6.3.4/#204 and v6.3.5/#205 with no entry and only auto-generated notes.)"
            exit 1
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Download and verify release assets
        if: steps.detect.outputs.proceed == 'true'
        uses: actions/download-artifact@v8 # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/shepherd-release-assets

      - name: Verify all release asset checksums
        if: steps.detect.outputs.proceed == 'true'
        shell: bash
        env:
          ASSET_DIR: ${{ runner.temp }}/shepherd-release-assets
          VERSION: ${{ steps.ver.outputs.current }}
        run: |
          set -euo pipefail
          ASSET_LIST="${ASSET_DIR}.txt"
          scripts/verify-release-assets.sh "$ASSET_DIR" "$ASSET_LIST" "$VERSION"
          scripts/verify-release-distribution.sh "$ASSET_DIR" "$VERSION"
          mapfile -t release_files < "$ASSET_LIST"
          ((${#release_files[@]} == 32))

      # ─── Patch close: tag + GitHub release ─────────────────────────────────
      - name: Tag the verified release commit
        if: steps.detect.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            local_target=$(git rev-list -n 1 "$TAG")
            [ "$local_target" = "$GITHUB_SHA" ] || {
              printf 'existing local tag %s resolves to %s, expected event SHA %s\n' \
                "$TAG" "$local_target" "$GITHUB_SHA" >&2
              exit 1
            }
          else
            git tag -a "$TAG" -m "$TAG"
          fi
          remote_direct=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk 'NR == 1 { print $1 }')
          remote_peeled=$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk 'NR == 1 { print $1 }')
          if [ -n "$remote_direct" ]; then
            remote_target="${remote_peeled:-$remote_direct}"
            [ "$remote_target" = "$GITHUB_SHA" ] || {
              printf 'existing remote tag %s resolves to %s, expected event SHA %s\n' \
                "$TAG" "$remote_target" "$GITHUB_SHA" >&2
              exit 1
            }
            echo "Tag $TAG already points at the event SHA; skipping push."
          else
            git push origin "$TAG"
          fi

      - name: Create GitHub Release (CHANGELOG notes)
        if: >-
          steps.detect.outputs.proceed == 'true' &&
          steps.notes.outputs.use_notes_file == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.path }}
          ASSET_DIR: ${{ runner.temp }}/shepherd-release-assets
          ASSET_LIST: ${{ runner.temp }}/shepherd-release-assets.txt
          VERSION: ${{ steps.ver.outputs.current }}
        run: |
          set -euo pipefail
          mapfile -t release_files < "$ASSET_LIST"
          ((${#release_files[@]} == 32)) || { echo 'missing verified release files' >&2; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            release_state=$(gh release view "$TAG" --json isDraft,isPrerelease,tagName)
            [ "$(jq -r '.tagName' <<<"$release_state")" = "$TAG" ]
            [ "$(jq -r '.isPrerelease' <<<"$release_state")" = false ] || {
              echo "existing release $TAG is unexpectedly a prerelease" >&2
              exit 1
            }
            remote_dir=$(mktemp -d "${RUNNER_TEMP}/shepherd-existing-release.XXXXXX")
            trap 'find "$remote_dir" -depth -delete' EXIT
            gh release download "$TAG" --dir "$remote_dir"
            scripts/verify-release-assets.sh "$remote_dir" "${remote_dir}.txt" "$VERSION"
            diff --recursive --brief "$ASSET_DIR" "$remote_dir"
            if [ "$(jq -r '.isDraft' <<<"$release_state")" = true ]; then
              gh release edit "$TAG" --draft=false
              echo "Published byte-identical recovered draft $TAG."
            else
              echo "Existing release $TAG is byte-identical; no upload required."
            fi
          else
            gh release create "$TAG" --verify-tag --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES" "${release_files[@]}"
          fi

      - name: Create GitHub Release (auto-generated notes)
        if: >-
          steps.detect.outputs.proceed == 'true' &&
          steps.notes.outputs.use_notes_file == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          ASSET_DIR: ${{ runner.temp }}/shepherd-release-assets
          ASSET_LIST: ${{ runner.temp }}/shepherd-release-assets.txt
          VERSION: ${{ steps.ver.outputs.current }}
        run: |
          set -euo pipefail
          mapfile -t release_files < "$ASSET_LIST"
          ((${#release_files[@]} == 32)) || { echo 'missing verified release files' >&2; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            release_state=$(gh release view "$TAG" --json isDraft,isPrerelease,tagName)
            [ "$(jq -r '.tagName' <<<"$release_state")" = "$TAG" ]
            [ "$(jq -r '.isPrerelease' <<<"$release_state")" = false ] || {
              echo "existing release $TAG is unexpectedly a prerelease" >&2
              exit 1
            }
            remote_dir=$(mktemp -d "${RUNNER_TEMP}/shepherd-existing-release.XXXXXX")
            trap 'find "$remote_dir" -depth -delete' EXIT
            gh release download "$TAG" --dir "$remote_dir"
            scripts/verify-release-assets.sh "$remote_dir" "${remote_dir}.txt" "$VERSION"
            diff --recursive --brief "$ASSET_DIR" "$remote_dir"
            if [ "$(jq -r '.isDraft' <<<"$release_state")" = true ]; then
              gh release edit "$TAG" --draft=false
              echo "Published byte-identical recovered draft $TAG."
            else
              echo "Existing release $TAG is byte-identical; no upload required."
            fi
          else
            gh release create "$TAG" --verify-tag --target "$GITHUB_SHA" --title "$TAG" --generate-notes "${release_files[@]}"
          fi
