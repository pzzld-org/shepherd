name: rust

on:
  push:
    branches: [main, "v*"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "scripts/check-features.sh"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    # WHY THIS JOB EXISTS.
    #
    # `cargo check --workspace` builds exactly ONE combination: the union of
    # every member's defaults. A `wasm` flag that resolves to a
    # dependency-not-found error, an `alloc` floor that quietly stopped being
    # no_std, or a `full` that pulls a crate with no wasm backend all keep
    # passing that check forever, because nothing references them.
    #
    # The umbrella's whole promise is that a future host can take the engine
    # with the capabilities it wants and none of the ones it does not. That
    # promise is worth exactly as much as the job that exercises it.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # sqlite-wasm-rs compiles SQLite from C to wasm; that needs a clang with a
      # WebAssembly backend. Ubuntu's has one, Apple's system clang does not.
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: ./scripts/check-features.sh --targets
