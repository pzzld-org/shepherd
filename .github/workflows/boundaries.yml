name: boundaries

  # --- JOBS ---
  #
  # -- engine --
  # Motivation: shepherd has been rewritten once already, Python to Rust, and the reason
  # was reach: the old implementation could not be embedded in a host that
  # needed it without the CLI wrapped around it. A third rewrite happens the
  # same way. `shepherd-core` is the insurance, and this job is what makes the
  # insurance real -- an architecture rule that only lives in a README drifts,
  # one that breaks a build does not.

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/boundaries.yml"
  pull_request:
    branches: [main, "v*"]
  workflow_dispatch:

# NOTE: `${{ github.workflow }}` rather than a hand-written name. Concurrency
# groups are shared across ALL workflows in a repository, so two workflows that
# both hard-code `rust-<ref>` with `cancel-in-progress` cancel each OTHER on
# every push -- and a cancelled boundary job reads as "not failed", which is
# exactly the outcome this workflow exists to prevent. That bug was live here.
# The interpolated form cannot collide, so it removes the class, not just the
# instance.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  engine:
    name: Verify the engine boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # 0. The three grep-based gates below only enforce anything as long as
      #    their regex can still fail. That property used to live in a prose
      #    comment; a gate with no negative control may be silently passing.
      #    This step runs each gate's own pattern against a deliberately
      #    broken synthetic fixture (must reject) and the real tree (must
      #    accept), so a regex a typo narrowed to nothing is caught here
      #    instead of no-opping forever.
      - name: boundary gates have a negative control
        run: bash .github/scripts/boundary-selftest.sh

      # 1. The engine must reach a non-native host.
      #    Catches anything that assumes an OS, a C toolchain, or a filesystem.
      #    No LLVM needed here: core has no C dependencies, and that is the point.
      - name: core compiles to wasm32-unknown-unknown
        run: cargo check -p shepherd-core --target wasm32-unknown-unknown

      # 2. Nothing on the library side may acquire delivery concerns.
      #
      #    Check 1 alone is NOT sufficient -- clap, anyhow and tracing-subscriber
      #    all compile to wasm perfectly well. Reaching a host and being free of
      #    host opinions are different properties and each needs its own gate.
      #
      #    Note the two tiers. Argument parsing, contextual errors, log sinks and
      #    config loading are forbidden EVERYWHERE on the library side, at every
      #    feature level, because they are delivery no matter who links them. An
      #    I/O backend is forbidden only in the engine: `shepherd-registry` owns
      #    SQLite legitimately, and the umbrella is allowed to re-export it when
      #    a consumer explicitly asks for the `registry` capability.
      #
      #    `config` USED to be on the delivery list and no longer is. The
      #    precedence chain -- ten candidate files, four tiers, harness
      #    parameterised, written highest-first while layering libraries apply
      #    lowest-first -- is engine policy, and an adapter that reimplements it
      #    gets a config file silently ignored. So `crates/core/src/loader.rs`
      #    owns it through `config::File::from_str`, which parses a `&str`.
      #    The I/O half is still forbidden, by name, in step 4.
      - name: libraries carry no delivery dependencies
        run: |
          set -euo pipefail
          delivery='^clap$|^anyhow$|^tracing-subscriber$'
          io_backend='^rusqlite$|^minijinja$|^libsqlite3-sys$'

          fail() {
            echo "::error::$1 acquired a forbidden dependency."
            echo "$2"
            echo "Offenders:"
            printf '%s\n' "$3"
            exit 1
          }

          # The cargo call is deliberately OUTSIDE the `|| true` below. Folded
          # in, a cargo failure yields an empty string, grep matches nothing,
          # and the gate reports "clean" while having checked nothing at all.
          # That exact vacuous pass was observed while writing this job.
          tree() {
            cargo tree -p "$@" --edges normal --prefix none | awk '{print $1}' | sort -u
          }

          # The engine, at its widest feature set, must be free of both tiers.
          core_full=$(tree shepherd-core --features full)
          hits=$(printf '%s\n' "$core_full" | grep -E "$delivery|$io_backend" || true)
          [ -z "$hits" ] || fail "shepherd-core" \
            "The engine must not depend on an argument parser, a contextual error type, a log sink, or an I/O backend." \
            "$hits"

          # The umbrella, at its widest feature set, must be free of delivery.
          # `full` deliberately includes registry and render, so an io_backend
          # hit here is expected and correct.
          sdk_full=$(tree shepherd-sdk --features full)
          hits=$(printf '%s\n' "$sdk_full" | grep -E "$delivery" || true)
          [ -z "$hits" ] || fail "shepherd" \
            "The SDK must not depend on delivery concerns; those belong to shepherd-cli or another adapter." \
            "$hits"

          # Positive control: `full` must actually reach the registry. Without
          # this, a typo that silently drops the capability would make the gate
          # above pass for the wrong reason.
          printf '%s\n' "$sdk_full" | grep -qE '^rusqlite$' || {
            echo "::error::shepherd --features full no longer links the registry."
            echo "The delivery gate above would then be passing vacuously."
            exit 1
          }

          # Default features are the embedder's entry point: taking the umbrella
          # without asking for a capability must not link SQLite or a templater.
          sdk_default=$(tree shepherd-sdk)
          hits=$(printf '%s\n' "$sdk_default" | grep -E "$delivery|$io_backend" || true)
          [ -z "$hits" ] || fail "shepherd (default features)" \
            "Default features must stay minimal; a capability a consumer did not request must not appear." \
            "$hits"

      # 3. The library side must not reach for the process it is running in.
      - name: libraries do not touch process or argv
        run: |
          set -euo pipefail
          # Comment lines are excluded deliberately: the boundary rule is
          # documented in these crates' own doc comments and would otherwise
          # match itself. Verified against a negative control before this job
          # was committed -- an injected `std::process::exit` is still caught.
          hits=$(grep -rnE 'std::process|std::env::args|process::exit' \
                   crates/core/src crates/registry/src crates/render/src crates/sdk/lib.rs \
                   | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "::error::a library crate referenced process or argv."
            echo "Process semantics belong to the binary, not the engine."
            echo "$hits"
            exit 1
          fi

      # 4. The engine may parse configuration; it may not go looking for it.
      #
      #    Dropping `config` from the dependency gate above bought a real
      #    property (one precedence chain instead of one per adapter) and cost
      #    a real guarantee (nothing stops someone reaching for the filesystem
      #    half of the same crate). This step restores the guarantee at the
      #    only level that can still see the difference: the call site.
      #
      #    `File::from_str` takes a `&str` and is fine. `File::with_name`,
      #    `File::from(Path)` and `Environment` read the filesystem and the
      #    process environment, and belong to the adapter.
      - name: the engine parses configuration but does not go looking for it
        run: |
          set -euo pipefail
          forbidden='config::Environment|Environment::with_prefix|File::with_name|File::from\(|add_source\(config::File::from\('
          hits=$(grep -rnE "${forbidden}" \
                   crates/core/src crates/registry/src crates/render/src crates/sdk/lib.rs \
                   | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "::error::a library crate reached for configuration I/O."
            echo "The engine owns WHICH files matter and IN WHAT ORDER"
            echo "(crates/core/src/loader.rs). Reading them -- File::with_name,"
            echo "File::from(Path), Environment -- belongs to shepherd-cli or"
            echo "another adapter. Use config::File::from_str over contents the"
            echo "caller supplies."
            echo "$hits"
            exit 1
          fi
