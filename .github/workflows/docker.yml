name: docker

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  repository_dispatch:
    types: [docker, docker-publish]
  workflow_dispatch:
    inputs:
      registry:
        description: "Set the container registry (overrides default docker.io)"
        required: false
        default: "docker.io"
        type: choice
        options: [docker.io, ghcr.io]
      version:
        description: "Set the version tag (overrides automatic version detection)"
        required: false
        default: "latest"
        type: string

env:
  REGISTRY: ${{ github.event.inputs.registry || 'docker.io' }}

permissions:
  actions: read
  attestations: write
  contents: read
  deployments: write
  id-token: write
  packages: write

jobs:
  build:
    name: Build and Push Docker Image
    environment:
      name: dockerhub
      url: https://hub.docker.com/r/${{ matrix.image_name }}
    env:
      IMAGE_NAME: ${{ matrix.image_name }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - registry: docker.io
            image_name: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Docker Metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          flavor: latest=true
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
      - id: build
        name: Build & Push the image to DockerHub
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: ./.docker/Dockerfile
          github-token: ${{ secrets.GITHUB_TOKEN }}
          platforms: linux/amd64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
      - name: Establish Proveance
        uses: actions/attest-build-provenance@v4
        if: github.event.repository.private == false
        id: attestation
        with:
          push-to-registry: true
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-name: ${{ matrix.registry }}/${{ matrix.image_name }}
