name: cargo-publish

# Cargo owns package construction, dependency ordering, upload, and registry
# polling. This workflow owns only release input validation, exact checkout
# custody, and post-command reconciliation against crates.io metadata.
#
# Ordinary releases call this workflow from release.yml after every release
# asset has passed. Manual dispatch is the recovery surface for a partially
# published workspace; pass only the missing package names through `packages`.

on:
  workflow_call:
    inputs:
      version:
        description: Exact MAJOR.MINOR.PATCH version to publish
        required: true
        type: string
      ref:
        description: Exact 40-character commit SHA to publish from
        required: false
        type: string
      packages:
        description: Comma- or space-separated recovery package names; blank selects the public workspace
        required: false
        default: ''
        type: string
      publish:
        description: Upload after validation; false performs Cargo's dry run
        required: false
        default: true
        type: boolean
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Exact MAJOR.MINOR.PATCH version to verify or recover
        required: true
        type: string
      ref:
        description: Exact 40-character commit SHA; blank uses the dispatched ref's SHA
        required: false
        default: ''
        type: string
      packages:
        description: Comma- or space-separated missing packages; blank selects the public workspace
        required: false
        default: ''
        type: string
      publish:
        description: Upload after validation
        required: true
        default: false
        type: boolean

concurrency:
  group: cargo-publish-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates with Cargo
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
    steps:
      - name: Resolve exact checkout SHA
        id: dispatch_ref
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          candidate="${REQUESTED_REF:-$EVENT_SHA}"
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            printf '::error::publish ref must be an exact 40-character commit SHA; found %s\n' "$candidate"
            exit 1
          fi
          printf 'ref=%s\n' "$candidate" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release commit
        uses: actions/checkout@v7 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.dispatch_ref.outputs.ref }}
          persist-credentials: false

      - name: Validate release authority
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '::error::version must be exact MAJOR.MINOR.PATCH; found %s\n' "$VERSION"
            exit 1
          fi
          python3 scripts/version-bump.py check --root . --version "$VERSION"
          python3 scripts/check-cargo-distribution.py

      - name: Setup pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          toolchain: 1.97.0

      - name: Build Cargo publication plan
        shell: bash
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages }}
          SELECTED_FILE: ${{ runner.temp }}/cargo-publish-selected.txt
          ARGS_FILE: ${{ runner.temp }}/cargo-publish-args.txt
        run: |
          set -euo pipefail

          public_packages=(
            shepherd-core
            shepherd-compiler
            shepherd-registry
            shepherd-render
            shepherd-sdk
            shepherd-cli
          )

          raw="${REQUESTED_PACKAGES//,/ }"
          selected=()
          cargo_args=()

          if [[ -z "${raw//[[:space:]]/}" ]]; then
            selected=("${public_packages[@]}")
            cargo_args=(--workspace --exclude shepherd-component)
          else
            read -r -a requested <<< "$raw"
            declare -A seen=()
            for package in "${requested[@]}"; do
              allowed=false
              for public_package in "${public_packages[@]}"; do
                if [[ "$package" == "$public_package" ]]; then
                  allowed=true
                  break
                fi
              done
              if [[ "$allowed" != true ]]; then
                printf '::error::unknown or non-public Cargo package: %s\n' "$package"
                exit 1
              fi
              if [[ -z "${seen[$package]+x}" ]]; then
                selected+=("$package")
                cargo_args+=(--package "$package")
                seen[$package]=1
              fi
            done
          fi

          if ((${#selected[@]} == 0)); then
            printf '::error::publication plan selected no packages\n'
            exit 1
          fi

          printf '%s\n' "${selected[@]}" > "$SELECTED_FILE"
          printf '%s\n' "${cargo_args[@]}" > "$ARGS_FILE"
          printf 'Cargo publication selection: %s\n' "${selected[*]}"

      - name: Verify packages with Cargo dry run
        if: ${{ ! inputs.publish }}
        shell: bash
        env:
          ARGS_FILE: ${{ runner.temp }}/cargo-publish-args.txt
        run: |
          set -euo pipefail
          mapfile -t cargo_args < "$ARGS_FILE"
          cargo publish --locked --dry-run "${cargo_args[@]}"

      - name: Publish packages with Cargo
        if: ${{ inputs.publish }}
        id: cargo_publish
        continue-on-error: true
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ARGS_FILE: ${{ runner.temp }}/cargo-publish-args.txt
        run: |
          set -euo pipefail
          mapfile -t cargo_args < "$ARGS_FILE"
          cargo publish --locked "${cargo_args[@]}"

      # Cargo can return non-zero after an upload when its own visibility poll
      # times out. Reconcile the exact versions once, through metadata only.
      # Never download archives here: a transient CDN/read failure must not
      # redefine a registry-accepted publication as a failed upload.
      - name: Reconcile exact crates.io versions
        if: ${{ inputs.publish }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CARGO_OUTCOME: ${{ steps.cargo_publish.outcome }}
          SELECTED_FILE: ${{ runner.temp }}/cargo-publish-selected.txt
          PUBLISH_REF: ${{ steps.dispatch_ref.outputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mapfile -t selected < "$SELECTED_FILE"
          missing=("${selected[@]}")
          max_attempts=12
          retry_seconds=10
          user_agent='shepherd-release-workflow (+https://github.com/pzzld-org/shepherd)'

          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            next_missing=()
            for crate in "${missing[@]}"; do
              body=$(curl --silent --show-error --fail --location \
                --retry 2 --retry-all-errors --retry-delay 2 \
                --max-time 20 \
                --header "User-Agent: ${user_agent}" \
                "https://crates.io/api/v1/crates/${crate}/${VERSION}") || body=''
              if [[ -n "$body" ]] \
                && jq -e --arg version "$VERSION" \
                  '.version.num == $version' <<< "$body" >/dev/null 2>&1; then
                printf 'Verified %s@%s in crates.io metadata.\n' "$crate" "$VERSION"
              else
                next_missing+=("$crate")
              fi
            done

            missing=("${next_missing[@]}")
            if ((${#missing[@]} == 0)); then
              if [[ "$CARGO_OUTCOME" != success ]]; then
                printf '::notice::Cargo returned %s, but every selected exact version is present on crates.io; publication is complete.\n' "$CARGO_OUTCOME"
              fi
              exit 0
            fi

            printf 'crates.io has not reported all exact versions (attempt %s/%s): %s\n' \
              "$attempt" "$max_attempts" "${missing[*]}" >&2
            if ((attempt < max_attempts)); then
              sleep "$retry_seconds"
            fi
          done

          missing_csv=$(IFS=,; printf '%s' "${missing[*]}")
          printf '::error title=Incomplete crates.io publication::Cargo outcome=%s; missing exact version %s for: %s. Recover from the same commit with: gh workflow run cargo-publish.yml --ref %s -f version=%s -f ref=%s -f publish=true -f packages=%s\n' \
            "$CARGO_OUTCOME" "$VERSION" "${missing[*]}" "$DEFAULT_BRANCH" "$VERSION" "$PUBLISH_REF" "$missing_csv"
          exit 1
