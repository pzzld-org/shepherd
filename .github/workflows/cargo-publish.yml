name: cargo-publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Exact MAJOR.MINOR.PATCH version to recover
        required: true
        type: string
      publish:
        description: Publish absent crates after checksum verification
        required: true
        default: false
        type: boolean

concurrency:
  group: cargo-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v7 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          toolchain: 1.97.0
      - name: Resolve exact version and checkout custody
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            test "$(git rev-list -n 1 "$GITHUB_REF")" = "$GITHUB_SHA"
          else
            version="$REQUESTED_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 scripts/version-bump.py check --root . --version "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Prepare and verify immutable crate bytes
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          STATE: ${{ runner.temp }}/shepherd-cargo-state.json
        run: python3 scripts/cargo-publish.py prepare --version "$VERSION" --state "$STATE"
      - name: Publish or resume dependency waves
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          STATE: ${{ runner.temp }}/shepherd-cargo-state.json
        run: python3 scripts/cargo-publish.py publish --version "$VERSION" --state "$STATE" --confirm
