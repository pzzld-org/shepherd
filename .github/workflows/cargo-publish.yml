name: cargo-publish

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: Exact MAJOR.MINOR.PATCH version to recover
        required: true
        type: string
      publish:
        description: Publish absent crates after checksum verification
        required: true
        default: false
        type: boolean

concurrency:
  group: cargo-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v7 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve exact version and detect release commit
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            # Manual recovery: the operator names the exact version. Not
            # gated on detect-release-commit.sh -- a recovery run may target
            # a version whose release commit already merged and moved on.
            version="$REQUESTED_VERSION"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            python3 scripts/version-bump.py check --root . --version "$version"
            proceed=true
          else
            # Ordinary push to the default branch: publish only for a
            # genuine release commit, using the exact same predicate
            # release.yml gates on. Everything else publishes nothing.
            subject=$(git log -1 --format=%s HEAD)
            detect_output=$(scripts/detect-release-commit.sh \
              --subject "$subject" \
              --ref "$GITHUB_REF" \
              --default-branch "$DEFAULT_BRANCH" \
              --plugin-json .claude-plugin/plugin.json)
            verdict=''
            version=''
            while IFS= read -r line; do
              case "$line" in
                verdict=*) verdict="${line#verdict=}" ;;
                version=*) version="${line#version=}" ;;
              esac
            done <<<"$detect_output"
            if [[ "$verdict" == proceed ]]; then
              python3 scripts/version-bump.py check --root . --version "$version"
              proceed=true
            else
              proceed=false
            fi
          fi
          {
            printf 'version=%s\n' "$version"
            printf 'proceed=%s\n' "$proceed"
          } >> "$GITHUB_OUTPUT"
      - name: Setup pinned Rust toolchain
        if: steps.release.outputs.proceed == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          toolchain: 1.97.0
      - name: Prepare and verify immutable crate bytes
        if: steps.release.outputs.proceed == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          STATE: ${{ runner.temp }}/shepherd-cargo-state.json
        run: python3 scripts/cargo-publish.py prepare --version "$VERSION" --state "$STATE"
      - name: Publish or resume dependency waves
        if: steps.release.outputs.proceed == 'true' && (github.event_name == 'push' || inputs.publish == true)
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          STATE: ${{ runner.temp }}/shepherd-cargo-state.json
        run: python3 scripts/cargo-publish.py publish --version "$VERSION" --state "$STATE" --confirm
