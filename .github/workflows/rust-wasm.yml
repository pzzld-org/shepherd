name: rust-wasm

# WHY THIS IS ITS OWN WORKFLOW.
#
# WebAssembly is not a nice-to-have here, it is the reason the crate split
# exists. Shepherd was rewritten once, Python to Rust, because the old
# implementation could not reach a new host; `wasm32-*` is the concrete proof
# that the new one can. Folding these checks into `rust.yml` would hide them
# behind a matrix leg nobody reads, and they need a toolchain (wasi-sdk, a
# clang with a wasm backend, wasmtime) that no other job wants.
#
# The two targets are NOT interchangeable, and the difference is the whole
# story. `rusqlite` 0.40 selects its SQLite backend by target cfg:
#
#   wasm32-unknown-unknown -> sqlite-wasm-rs, `bundled` OFF.
#       In-memory VFS, plus OPFS in browsers. Node has no OPFS, so this
#       target CANNOT open `.shepherd/shepherd.db` as a real file.
#   wasm32-wasip1/p2       -> libsqlite3-sys + the WASI VFS, `bundled` ON.
#       Reaches a real preopened directory, so it CAN.
#
# That distinction decides whether an in-process Pi embedding is possible at
# all, so both are built and the WASI one has its behaviour executed rather
# than merely compiled.

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  pull_request:
    branches: [main, master, "v*"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "crates/component/wit/**"
      - "content/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/test-component-node.sh"
      - "packages/scripts/test-component-node.mjs"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-wasm.yml"
      - ".claude-plugin/**"
      - "plugins/shepherd/**"
      - "hooks/hooks.json"
      - "agents/**"
      - "skills/**"
      - "scripts/tests/test-claude-marketplace.sh"
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "crates/component/wit/**"
      - "content/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/test-component-node.sh"
      - "packages/scripts/test-component-node.mjs"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-wasm.yml"
      - ".claude-plugin/**"
      - "plugins/shepherd/**"
      - "hooks/hooks.json"
      - "agents/**"
      - "skills/**"
      - "scripts/tests/test-claude-marketplace.sh"
  repository_dispatch:
    types: [wasm, rust-wasm]
  workflow_dispatch:

env:
  CACHE_ON_FAILURE: true
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # Pinned rather than floating: a wasi-sdk bump changes the C compiler that
  # builds SQLite, which is exactly the kind of thing that should move on a
  # commit somebody reviewed.
  WASI_SDK_VERSION: "33"
  WASI_SDK_RELEASE: "33.0"
  WASM_TOOLS_VERSION: "1.254.0"

permissions:
  contents: read

jobs:
  resolve:
    name: resolve ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.dispatch_ref.outputs.ref }}
    steps:
      # `client_payload.*` is authored by whoever sends the dispatch, and
      # dispatch is grantable WITHOUT `contents: write` -- so interpolating it
      # into `ref:` lets a token that cannot push a commit still make CI check
      # out and execute arbitrary code (FL03/axiom#2578). The untrusted value
      # reaches the script through `env:` and is never spliced into the command.
      - name: Resolve a trusted checkout ref
        id: dispatch_ref
        shell: bash
        env:
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          FALLBACK_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ -z "${DISPATCH_REF}" ]]; then
            printf 'ref=%s\n' "${FALLBACK_REF}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${DISPATCH_REF}" =~ ^(refs/heads/|refs/tags/)?(main|master|latest|v[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?)$ ]] \
            || [[ "${DISPATCH_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'ref=%s\n' "${DISPATCH_REF}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          printf '::error::rejected dispatch ref: not an allowlisted branch, tag, or commit SHA\n'
          exit 1

  # ------------------------------------------------------------------ #
  # wasm32-unknown-unknown — the reach check.                          #
  #                                                                     #
  # Every library member must compile here. This is what catches a      #
  # dependency that assumes an OS, a C toolchain, or a filesystem.      #
  # ------------------------------------------------------------------ #
  unknown:
    name: wasm32-unknown-unknown (${{ matrix.package }})
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: shepherd-core
            features: wasm
          - package: shepherd-compiler
            features: wasm
          - package: shepherd-sdk
            features: wasm
          # The interesting one: proves `sqlite-wasm` is wired to the backend
          # rusqlite actually selects on this target.
          - package: shepherd-registry
            features: wasm
          - package: shepherd-render
            features: wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve.outputs.ref }}
          repository: ${{ github.repository }}
      - name: Setup rust-cache
        uses: Swatinem/rust-cache@v2 # v2.9.2
        with:
          key: wasm-unknown-${{ matrix.package }}
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          target: wasm32-unknown-unknown
      - name: Verify runner clang
        run: clang --version
      - name: cargo build ${{ matrix.package }}
        run: |
          cargo build --locked --release \
            --package ${{ matrix.package }} \
            --target wasm32-unknown-unknown \
            --no-default-features --features ${{ matrix.features }}

  # ------------------------------------------------------------------ #
  # wasm32-wasip1 / p2 — the behaviour check.                          #
  #                                                                     #
  # Building proves the C cross-compile. It does not prove the module   #
  # links, or that SQLite's WASI VFS reaches a real file. So the        #
  # registry's gate tests are EXECUTED under wasmtime here.             #
  # ------------------------------------------------------------------ #
  wasi:
    name: ${{ matrix.target }} (execute)
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-wasip1, wasm32-wasip2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve.outputs.ref }}
          repository: ${{ github.repository }}
      - name: Setup rust-cache
        uses: Swatinem/rust-cache@v2 # v2.9.2
        with:
          key: wasi-${{ matrix.target }}
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          target: ${{ matrix.target }}
      # The tarball is ~180MB and expands to ~1GB, so it is cached on the
      # pinned version rather than re-downloaded on every run.
      - name: Cache wasi-sdk
        id: wasi-sdk-cache
        uses: actions/cache@v6 # v6.1.0
        with:
          path: /opt/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_RELEASE }}-x86_64-linux
      - name: Install wasi-sdk
        if: steps.wasi-sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_RELEASE}-x86_64-linux.tar.gz"
          printf 'downloading %s\n' "${url}"
          curl -fsSL -o /tmp/wasi-sdk.tar.gz "${url}"
          sudo mkdir -p /opt/wasi-sdk
          sudo tar xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
      # `cc` reads WASI_SDK_PATH natively and derives clang, llvm-ar and the
      # sysroot from it -- wasi-sdk ships `bin/clang.cfg` carrying
      # `--sysroot=<CFGDIR>/../share/wasi-sysroot`. Setting CC_/AR_/CFLAGS_ per
      # target also works and is the belt-and-braces form; this is the minimum
      # that was verified to work.
      - name: Export the wasi-sdk path
        run: echo "WASI_SDK_PATH=/opt/wasi-sdk" >> "${GITHUB_ENV}"
      - name: Setup wasmtime
        uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      - name: Setup wasm-tools
        uses: taiki-e/install-action@v2
        if: matrix.target == 'wasm32-wasip2'
        with:
          tool: wasm-tools@${{ env.WASM_TOOLS_VERSION }}
      - name: cargo build shepherd-registry
        run: |
          cargo build --locked --release \
            --package shepherd-registry \
            --target ${{ matrix.target }} \
            --no-default-features --features wasi
      - name: Build and validate the Shepherd component
        if: matrix.target == 'wasm32-wasip2'
        run: |
          set -euo pipefail
          cargo build --locked --release --package shepherd-component --target wasm32-wasip2
          artifact="target/wasm32-wasip2/release/shepherd_component.wasm"
          # Every check below names what it found. The previous form was a chain
          # of `grep -Fq` and bare `test`, so a failure printed NOTHING and the
          # step died with only `exit code 1` -- diagnosing it took a log dive.
          wasm-tools validate "${artifact}" \
            || { printf 'component failed wasm-tools validate: %s\n' "${artifact}" >&2; exit 1; }
          wit_output="${RUNNER_TEMP}/shepherd.wit"
          wasm-tools component wit "${artifact}" > "${wit_output}"
          test -s "${wit_output}" \
            || { printf 'wit extraction produced an empty file: %s\n' "${wit_output}" >&2; exit 1; }
          # Derived, not pinned. A literal here made this file a version
          # authority, so `version-bump.py` rewrote it on every release and the
          # gitflow handoff could not push the bumped branch: GITHUB_TOKEN has
          # no `workflows` scope (it is not in the permission vocabulary at
          # all), so GitHub refuses any push that updates a workflow file.
          # Reading the single source of truth removes the whole problem.
          component_version=$(python3 -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"])')
          expected_export="export fl03:shepherd/engine@${component_version};"
          grep -Fq "${expected_export}" "${wit_output}" || {
            printf 'component does not export the pinned interface\n  expected: %s\n  exports found:\n' "${expected_export}" >&2
            grep -F 'export ' "${wit_output}" >&2 || printf '    (none)\n' >&2
            exit 1
          }
          resolved_imports="${RUNNER_TEMP}/shepherd.imports"
          # The `@0.2.x` suffix is a toolchain artifact, not a property of this
          # code: a runner and a workstation on different Rust releases emit
          # different WASI point versions from identical source. Pinning it made
          # the gate unsatisfiable on both at once. What this gate is actually
          # about is WHICH capabilities the component can reach, so the version
          # is stripped and the interface set is what must not drift.
          sed -n 's/^  import \(wasi:[^;@]*\)[^;]*;$/\1/p' "${wit_output}" \
            | LC_ALL=C sort -u > "${resolved_imports}"
          pinned='crates/component/wit/resolved-imports.txt'
          # Derived from the pinned file, never hardcoded: a literal count drifts
          # out of step with the list it is supposed to describe.
          expected_count=$(wc -l < "${pinned}" | tr -d ' ')
          resolved_import_count=$(wc -l < "${resolved_imports}" | tr -d ' ')
          printf 'component imports %s WASI interfaces (pinned: %s)\n' \
            "${resolved_import_count}" "${expected_count}"
          diff -u "${pinned}" "${resolved_imports}" || {
            printf '\ncomponent WASI import surface changed.\n' >&2
            printf 'This is a CAPABILITY change, not a lint: the component can reach\n' >&2
            printf 'something it previously could not, or has lost something it needed.\n' >&2
            printf 'If intended, regenerate with:\n' >&2
            printf "  wasm-tools component wit %s | sed -n 's/^  import \\(wasi:[^;]*\\);\$/\\1/p' | LC_ALL=C sort > %s\n" \
              "${artifact}" "${pinned}" >&2
            exit 1
          }
      - name: Call the component from Node through jco
        if: matrix.target == 'wasm32-wasip2'
        run: |
          npm ci --ignore-scripts
          bash scripts/test-component-node.sh
          node --test packages/component-runtime/test/*.test.mjs
          node packages/harness-claude/test.mjs
          node packages/harness-codex/test.mjs
          node packages/harness-pi/test.mjs
          node packages/scripts/check-package-boundary.mjs
          bash scripts/test-packed-plugin.sh
          bash scripts/tests/test-claude-marketplace.sh
      # THE POINT OF THIS JOB. `.cargo/config.toml` sets the runner to
      # `wasmtime --dir=. --dir=/tmp`, so these tests do not merely compile --
      # they execute, and one of them opens a real file-backed database, closes
      # it, and reads the row back through the WASI VFS. SQLite falls back from
      # requested WAL to delete journaling here because WASI has no WAL
      # shared-memory locking.
      #
      # That is the property `wasm32-unknown-unknown` cannot satisfy in Node,
      # and it is the first half of the v6.5.x in-process spike's success
      # criterion. Regressing it should break a build, not a spike six months
      # from now.
      - name: execute the registry gate tests under wasmtime
        run: |
          cargo test --locked \
            --package shepherd-registry \
            --target ${{ matrix.target }} \
            --no-default-features --features wasi \
            -- --nocapture
      - name: Report module size
        run: |
          set -euo pipefail
          printf '### %s artifacts\n\n' "${{ matrix.target }}" >> "${GITHUB_STEP_SUMMARY}"
          printf '| artifact | bytes |\n|---|---:|\n' >> "${GITHUB_STEP_SUMMARY}"
          while IFS= read -r artifact; do
            printf '| `%s` | %s |\n' \
              "$(basename "${artifact}")" \
              "$(stat -c%s "${artifact}")" >> "${GITHUB_STEP_SUMMARY}"
          done < <(find "target/${{ matrix.target }}/release" -maxdepth 1 -name '*.rlib' -o -maxdepth 1 -name '*.wasm' | sort)
